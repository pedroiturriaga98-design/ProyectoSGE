{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administrador - SGE</title>
    <link rel="stylesheet" href="{% static 'css/base_admin.css' %}">
</head>
<body>

    <aside class="sidebar-left">
        <div class="logo-area">
            <span class="logo-badge">SGE</span>
            <div>
                <strong>Sistema de Gestión</strong>
                <div style="font-size: 0.7rem; color: #9ca3af;">Colegio Santa Juliana</div>
            </div>
        </div>

        <div class="sidebar-controls">
            <select class="select-year">
                <option>Año Escolar 2026</option>
            </select>
            <input type="text" class="search-bar" placeholder="Buscar alumno, profesor...">
        </div>

        <nav class="nav-menu">
            <a href="{% url 'admin_inicio' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_inicio' %}active-menu{% endif %}">Inicio</a>
            <a href="{% url 'admin_gestion_usuarios' %}" class="nav-link {% if 'usuarios' in request.path %}active-menu{% endif %}">Gestión de Usuarios</a>
            <a href="{% url 'admin_gestion_incidencias' %}" class="nav-link {% if 'incidencias' in request.path %}active-menu{% endif %}">Incidencias</a>
            <a href="{% url 'admin_alumnos' %}" class="nav-link {% if 'alumnos' in request.path %}active-menu{% endif %}">Alumnos</a>
            <a href="{% url 'admin_gestion_apoderados' %}" class="nav-link {% if 'apoderados' in request.path %}active-menu{% endif %}">Apoderados</a>
            <a href="{% url 'admin_gestion_profesores' %}" class="nav-link {% if 'profesores' in request.path %}active-menu{% endif %}">Profesores</a>
            <a href="{% url 'admin_gestion_inventario' %}" class="nav-link {% if 'inventario' in request.path %}active-menu{% endif %}">Gestión Inventario</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="last-access">Último acceso: Hoy, 08:15 AM</div>
            <div class="user-profile">
                <div class="user-info">
                    <div class="user-details">
                        <h4>Pedro Ignacio Iturriaga</h4>
                        <p>Administrador</p>
                    </div>
                    <img src="" alt="Avatar">
                </div>
                <a href="{% url 'login' %}" class="btn-logout">⍈ Cerrar sesión</a>
            </div>
        </header>

        <div class="content-area">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
