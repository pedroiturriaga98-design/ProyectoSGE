{% extends 'base_admin.html' %}

{% block content %}

<div class="page-header">
    <h2>Editar Apoderado</h2>
    <p>Modifique la información personal y el estado de la cuenta del apoderado.</p>
</div>

<div class="form-card">
    <div class="form-grid">
        <div class="form-group">
            <label>Nombres</label>
            <input type="text" class="form-control" value="Carolina">
        </div>
        <div class="form-group">
            <label>RUT</label>
            <input type="text" class="form-control" value="12.345.678-9" disabled title="El RUT no se puede modificar">
        </div>

        <div class="form-group">
            <label>Apellidos</label>
            <input type="text" class="form-control" value="González Muñoz">
        </div>
        <div class="form-group">
            <label>Email Institucional</label>
            <input type="email" class="form-control" value="c.gonzalez@santajuliana.cl">
        </div>

        <div class="form-group">
            <label>Teléfono de Contacto</label>
            <input type="text" class="form-control" value="+56 9 1234 5678">
        </div>
        <div class="form-group">
            <label>Estado de la Cuenta</label>
            <div class="toggle-container">
                <input type="checkbox" class="toggle-switch" checked>
                <span style="font-size: 0.9rem; color: #0f172a; font-weight: 500;">Activo y con acceso</span>
            </div>
        </div>

        <div class="form-group full-width">
            <label>Pupilos Vinculados</label>
            <input type="text" class="form-control" value="Martín González (3° Básico A)" disabled style="background-color: #fffbeb; border-color: #fde68a; color: #b45309;">
        </div>
    </div>

    <div class="form-footer">
        <button class="btn-cancel" onclick="window.history.back()">Cancelar</button>
        <a class="btn-submit" href="{% url 'admin_gestion_apoderados' %}" onclick="alert('Datos del apoderado actualizados.')">Guardar Cambios</a>
    </div>
</div>
{% endblock %}
