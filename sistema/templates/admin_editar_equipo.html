{% extends 'base_admin.html' %}

{% block content %}

<div class="page-header">
    <h2>Registrar / Editar Equipo</h2>
    <p>Complete los datos para añadir o modificar un equipo en el inventario tecnológico.</p>
</div>

<div class="form-card">
    <div class="form-grid">
        <div class="form-group full-width">
            <label>Código Interno <span>*</span></label>
            <input type="text" class="form-control" value="PC-LAB3-045">
        </div>
        
        <div class="form-group full-width">
            <label>Tipo Dispositivo</label>
            <select class="form-control">
                <option selected>All-in-One</option>
                <option>Notebook</option>
                <option>Proyector</option>
                <option>Impresora</option>
            </select>
        </div>

        <div class="form-group">
            <label>Marca</label>
            <input type="text" class="form-control" value="HP">
        </div>
        <div class="form-group">
            <label>Modelo</label>
            <input type="text" class="form-control" value="ProOne 440">
        </div>

        <div class="form-group full-width">
            <label>N° Serie</label>
            <input type="text" class="form-control" value="MXL40938FF82">
        </div>

        <div class="form-group">
            <label>Sala/Laboratorio</label>
            <select class="form-control">
                <option selected>Laboratorio 3</option>
                <option>Laboratorio 1</option>
                <option>Sala Profesores</option>
                <option>Biblioteca</option>
            </select>
        </div>
        <div class="form-group">
            <label>Estado</label>
            <select class="form-control">
                <option selected>Operativo</option>
                <option>En Mantención</option>
                <option>Dado de Baja</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label>Observaciones</label>
            <textarea class="form-control">Equipo nuevo asignado al tercer laboratorio...</textarea>
        </div>
    </div>

    <div class="form-footer">
        <button class="btn-cancel" onclick="window.history.back()">Cancelar</button>
        <a class="btn-submit" href="{% url 'admin_gestion_inventario' %}" onclick="alert('Equipo guardado en el inventario correctamente.')">Guardar Equipo</a>
    </div>
</div>
{% endblock %}
