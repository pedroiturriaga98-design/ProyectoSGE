{% extends 'base_admin.html' %}

{% block content %}

<div class="page-header">
    <h2>Registrar Incidencia</h2>
    <p>Complete el formulario para reportar una falla técnica o requerimiento.</p>
</div>

<div class="form-card">

    <div class="form-title">Datos de la Incidencia</div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" style="padding: 12px; margin-bottom: 15px; border-radius: 6px; background: #f1f5f9;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'admin_crear_incidencia' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Nombre y Apellido</label>
            <input
                type="text"
                class="form-control"
                value="{{ request.session.nombre_usuario }} {{ request.session.apellido_usuario }}"
                disabled
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Fecha de la Incidencia *</label>
                <input
                    type="date"
                    name="fecha"
                    class="form-control"
                    value="{{ fecha_actual }}"
                    required
                >
            </div>


            <div class="form-group">
                <label>Tipo de Incidencia *</label>

                <select
                    name="tipo"
                    id="tipo-incidencia"
                    class="form-control"
                    required
                >
                    <option value="">Seleccione una opción...</option>

                    <option value="material">
                        Solicitud de Material
                    </option>

                    <option value="reposicion">
                        Solicitud de Reposición
                    </option>

                    <option value="equipo">
                        Problema con Equipo
                    </option>

                    <option value="mantenimiento">
                        Mantenimiento
                    </option>
                </select>
            </div>

        </div>

        <div class="form-group" id="grupo-equipo" style="display: none;">

            <label>Equipo involucrado *</label>

            <select
                name="equipo"
                id="equipo"
                class="form-control"
            >
                <option value="">Seleccione un equipo...</option>

                {% for equipo in equipos %}
                    <option value="{{ equipo.codigo_inventario }}">
                        {{ equipo.nombre_equipo }} -
                        {{ equipo.codigo_inventario }} -
                        {{ equipo.ubicacion }}
                    </option>
                {% endfor %}

            </select>

        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="prioridad" style="display: block; font-weight: 500; margin-bottom: 8px; color: #1e293b;">Nivel de Criticidad / Prioridad *</label>
            <select id="prioridad" name="prioridad" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; background: white;">
                <option value="Baja">Baja - Detalle menor (ej. mouse con pilas bajas)</option>
                <option value="Media" selected>Media - Falla parcial (ej. un PC lento)</option>
                <option value="Alta">Alta - Bloquea una clase (ej. proyector quemado)</option>
                <option value="Crítica">Crítica - Emergencia general (ej. corte de red)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Comentario / Descripción Detallada *</label>

            <textarea
                name="descripcion"
                class="form-control"
                rows="5"
                placeholder="Describa el material que necesita o el problema encontrado..."
                required
            ></textarea>
        </div>

        <div class="form-actions">

            <button
                type="button"
                class="btn-cancel"
                onclick="window.history.back()"
            >
                Cancelar
            </button>

            <button type="submit" class="btn-submit">
                Enviar Solicitud
            </button>

        </div>

    </form>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const tipo = document.getElementById('tipo-incidencia');
    const grupoEquipo = document.getElementById('grupo-equipo');
    const equipo = document.getElementById('equipo');

    function actualizarFormulario() {

        const requiereEquipo =
            tipo.value === 'equipo' ||
            tipo.value === 'mantenimiento';

        grupoEquipo.style.display = requiereEquipo ? 'block' : 'none';

        equipo.required = requiereEquipo;

        if (!requiereEquipo) {
            equipo.value = '';
        }
    }

    tipo.addEventListener('change', actualizarFormulario);

    actualizarFormulario();
});
</script>

{% endblock %}


<div class="form-group" style="margin-bottom: 20px;">
    <label for="prioridad" style="display: block; font-weight: 500; margin-bottom: 8px; color: #1e293b;">Nivel de Criticidad / Prioridad *</label>
    <select id="prioridad" name="prioridad" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; background: white;">
        <option value="Baja">Baja - Detalle menor (ej. mouse con pilas bajas)</option>
        <option value="Media" selected>Media - Falla parcial (ej. un PC lento)</option>
        <option value="Alta">Alta - Bloquea una clase (ej. proyector quemado)</option>
        <option value="Crítica">Crítica - Emergencia general (ej. corte de red)</option>
    </select>
</div>
