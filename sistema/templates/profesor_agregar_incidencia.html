{% extends 'base_profesor.html' %}

{% block content %}

<div class="page-header">
    <h2>Agregar Incidencia</h2>
    <p>Complete el formulario para reportar una necesidad de material o problema con equipos</p>
</div>

<div class="form-card">
    <div class="form-title">Datos de la Incidencia</div>
    
    <div class="form-group">
        <label>Nombre y Apellido</label>
        <input type="text" class="form-control" value="Cristian Morales Rivas" disabled>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Fecha de la Incidencia *</label>
            <input type="date" class="form-control" id="fecha-incidencia">
        </div>
        <div class="form-group">
            <label>Tipo de Incidencia *</label>
            <select class="form-control">
                <option value="">Seleccione una opción...</option>
                <option>Solicitud de Material</option>
                <option>Problema con Equipo</option>
                <option>Mantenimiento</option>
                <option>Otro</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Comentario / Descripción Detallada *</label>
        <textarea class="form-control" placeholder="Describa el material que necesita o el problema encontrado..."></textarea>
    </div>

    <div class="form-actions">
        <button class="btn-cancel" onclick="window.history.back()">Cancelar</button>
        <button class="btn-submit" onclick="alert('Solicitud enviada correctamente.')">Enviar Solicitud</button>
    </div>
</div>

<script>
    // Asignar fecha actual automáticamente al campo de fecha
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("fecha-incidencia").value = new Date().toISOString().split('T')[0];
    });
</script>
{% endblock %}
