<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambio de Contraseña Obligatorio - SGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <div class="text-center mb-3">
            <h3 class="fw-bold text-primary">Seguridad de la Cuenta</h3>
            <p class="text-muted small">Es tu primer ingreso. Por seguridad, debes cambiar tu contraseña predeterminada (RUT).</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Nueva Contraseña</label>
                <input type="password" name="nueva_password" class="form-control" placeholder="Ingresa tu nueva clave" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Confirmar Nueva Contraseña</label>
                <input type="password" name="conf_password" class="form-control" placeholder="Repite la nueva clave" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Actualizar Contraseña y Entrar</button>
        </form>
    </div>
</body>
</html>
