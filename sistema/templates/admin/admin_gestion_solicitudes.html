<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }} - SGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Aquí puedes incluir tu navbar base del admin -->
    
    <div class="container mt-5">
        <h2 class="fw-bold text-primary mb-4">{{ titulo }}</h2>
        
        <div class="card shadow p-4">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>RUT Usuario</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in solicitudes %}
                        <tr>
                            <td>#{{ s.id_solicitud }}</td>
                            <td>{{ s.fecha }}</td>
                            <td>{{ s.usuario_rut }}</td>
                            <td>{{ s.descripcion }}</td>
                            <td>
                                <span class="badge bg-warning text-dark">{{ s.estado_solicitud }}</span>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">No hay solicitudes registradas en esta categoría.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        <a href="javascript:history.back()" class="btn btn-secondary mt-3">Volver</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
